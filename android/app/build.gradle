apply plugin: 'com.android.application'

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = new File(System.getProperty('user.home'), '.android/otlobli-main-upload.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def signingValue = { String name ->
    def value = project.findProperty(name) ?: System.getenv(name) ?: releaseSigningProperties.getProperty(name)
    return value?.toString()?.trim()
}

def releaseStoreFile = signingValue('OTLOBLI_APP_STORE_FILE')
def releaseStorePassword = signingValue('OTLOBLI_APP_STORE_PASSWORD')
def releaseKeyAlias = signingValue('OTLOBLI_APP_KEY_ALIAS')
def releaseKeyPassword = signingValue('OTLOBLI_APP_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it }

def releaseArtifactRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    return normalized == 'assemblerelease' ||
        normalized == 'bundlerelease' ||
        normalized.endsWith(':app:assemblerelease') ||
        normalized.endsWith(':app:bundlerelease')
}

def temuPersonalSiteBuild = (project.findProperty('temuPersonalSite') ?: 'false').toString().toBoolean()
def temuPersonalAbi = (project.findProperty('temuPersonalAbi') ?: 'arm64-v8a').toString().trim()
def allowedTemuPersonalAbis = ['arm64-v8a', 'x86_64']
if (temuPersonalSiteBuild && !allowedTemuPersonalAbis.contains(temuPersonalAbi)) {
    throw new GradleException("Unsupported temuPersonalAbi '${temuPersonalAbi}'. Use arm64-v8a or x86_64.")
}

android {
    namespace = "com.otlobli.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.otlobli.app"
        minSdkVersion temuPersonalSiteBuild ? 26 : rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1071
        versionName temuPersonalSiteBuild ? "86.209-personal" : "86.209"
        buildConfigField "boolean", "TEMU_PERSONAL_SITE", temuPersonalSiteBuild.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (temuPersonalSiteBuild) {
            // The Gecko engine carries a large native library per ABI. The
            // personal phone artifact defaults to Note 8's arm64 ABI; pass
            // -PtemuPersonalAbi=x86_64 only for the laptop emulator build.
            ndk { abiFilters temuPersonalAbi }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            otlobliRelease {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            // Published code must go through R8. Debug stays readable so local
            // diagnostics and device acceptance remain practical.
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.otlobliRelease
        }
    }
    sourceSets {
        main {
            if (temuPersonalSiteBuild) {
                assets.srcDir 'src/temuPersonal/assets'
            }
        }
    }
}

gradle.taskGraph.whenReady {
    if (releaseArtifactRequested && !releaseSigningConfigured) {
        throw new GradleException(
            'Production release signing is required. Configure the four OTLOBLI_APP_* signing values.'
        )
    }
    if (releaseArtifactRequested && !file(releaseStoreFile).exists()) {
        throw new GradleException('The configured Otlobli production keystore does not exist.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Compile the isolated personal browser for both variants, but package
    // Gecko's large native engine only in the explicitly requested personal
    // build. The normal customer APK stays free of GeckoView.
    compileOnly "org.mozilla.geckoview:geckoview:153.0.20260810162159"
    if (temuPersonalSiteBuild) {
        implementation "org.mozilla.geckoview:geckoview:153.0.20260810162159"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
