services:
  # ─── WhatsApp OTP Server ───────────────────────────────────────────────────
  - type: web
    name: talabieh-whatsapp
    runtime: node
    plan: free
    # `server-whatsapp/` is retired and must never be deployed. The active
    # server fails closed until Supabase, OTP, and admin secrets are present.
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: WHATSAPP_ADMIN_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false

  # ─── Shein Scraper ────────────────────────────────────────────────────────
  - type: web
    name: talabieh-scraper
    runtime: node
    plan: free
    rootDir: server-scraper
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
