<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>otlobli — دعوة طلب مشترك</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f2f7f5; color: #17251f;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  .card {
    background: #fff; border: 1px solid rgba(0,105,72,.14);
    border-radius: 18px; padding: 26px 20px;
    max-width: 360px; width: 100%;
  }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #006948; }
  p { font-size: 14px; color: #607069; margin-bottom: 18px; line-height: 1.6; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; width: 100%; background: #006948; color: #fff;
    padding: 0 24px; border-radius: 13px; font-size: 16px;
    text-decoration: none; font-weight: 600;
  }
  .hint { font-size: 12px; color: #718078; margin: 14px 0 0; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛒</div>
  <h1>دعوة طلب مشترك</h1>
  <p id="msg">هذه الدعوة تجمع صاحب الطلب مع صديق واحد فقط.</p>
  <a id="openBtn" class="btn">فتح في تطبيق otlobli</a>
  <p class="hint" id="hint">اضغط الزر الأخضر لفتح الدعوة في التطبيق.</p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code') || params.get('group') || '';
  var store = params.get('store') || '';

  if (!code) {
    document.getElementById('msg').textContent = 'رابط غير صالح';
    document.getElementById('openBtn').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    return;
  }

  var appUrl = 'otlobli://group?' + new URLSearchParams({
    code: code, group: code, store: store
  }).toString();

  var btn = document.getElementById('openBtn');
  btn.href = appUrl;
})();
</script>
</body>
</html>
