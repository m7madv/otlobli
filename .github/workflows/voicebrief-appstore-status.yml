name: VoiceBrief App Store status

on:
  workflow_dispatch:
  push:
    branches:
      - codex/voicebrief-ios
    paths:
      - ".github/workflows/voicebrief-appstore-status.yml"

permissions:
  contents: read

jobs:
  inspect-build:
    name: Inspect VoiceBrief build 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VOICEBRIEF_APP_ID: "6805194629"
      VOICEBRIEF_BUILD_NUMBER: "18"
      VOICEBRIEF_INTERNAL_GROUP_NAME: "VoiceBrief Internal"

    steps:
      - name: Install App Store Connect client dependencies
        run: python -m pip install --disable-pip-version-check "PyJWT[crypto]>=2.8,<3"

      - name: Query App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          REPORT_PATH: ${{ runner.temp }}/voicebrief-appstore-build18.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          key_path="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          trap 'rm -f "$key_path"' EXIT
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          export APP_STORE_CONNECT_API_KEY_PATH="$key_path"

          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt


          app_id = os.environ["VOICEBRIEF_APP_ID"]
          build_number = os.environ["VOICEBRIEF_BUILD_NUMBER"]
          internal_group_name = os.environ["VOICEBRIEF_INTERNAL_GROUP_NAME"]
          key_id = os.environ["APP_STORE_CONNECT_API_KEY_ID"]
          issuer_id = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          key_path = pathlib.Path(os.environ["APP_STORE_CONNECT_API_KEY_PATH"])
          report_path = pathlib.Path(os.environ["REPORT_PATH"])

          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 1_200,
                  "aud": "appstoreconnect-v1",
              },
              key_path.read_text(encoding="utf-8"),
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          params = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[version]": build_number,
                  "include": "preReleaseVersion,betaGroups",
                  "limit": "10",
              }
          )
          url = f"https://api.appstoreconnect.apple.com/v1/builds?{params}"
          headers = {"Authorization": f"Bearer {token}"}


          def fetch_builds():
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.load(error)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      payload = {}
                  safe_errors = [
                      {
                          "status": item.get("status"),
                          "code": item.get("code"),
                          "title": item.get("title"),
                      }
                      for item in payload.get("errors", [])
                  ]
                  raise SystemExit(
                      "App Store Connect request failed: "
                      + json.dumps(safe_errors, ensure_ascii=False)
                  ) from error


          deadline = time.monotonic() + 1_200
          payload = {}
          build = None
          while True:
              payload = fetch_builds()
              builds = payload.get("data", [])
              build = next(
                  (
                      candidate
                      for candidate in builds
                      if candidate.get("attributes", {}).get("version") == build_number
                  ),
                  None,
              )
              if build is not None:
                  state = build.get("attributes", {}).get("processingState")
                  if state != "PROCESSING":
                      break
              if time.monotonic() >= deadline:
                  if build is None:
                      raise SystemExit(
                          f"VoiceBrief build {build_number} was not found for app {app_id}."
                      )
                  raise SystemExit(
                      f"VoiceBrief build {build_number} is still processing after 20 minutes."
                  )
              time.sleep(20)

          attributes = build.get("attributes", {})
          build_id = build.get("id")
          if not build_id:
              raise SystemExit(f"VoiceBrief build {build_number} has no build ID.")

          if attributes.get("processingState") != "VALID":
              raise SystemExit(
                  f"VoiceBrief build {build_number} is "
                  f"{attributes.get('processingState')}."
              )

          group_params = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[name]": internal_group_name,
                  "filter[isInternalGroup]": "true",
                  "limit": "10",
              }
          )
          groups_url = (
              "https://api.appstoreconnect.apple.com/v1/betaGroups?"
              + group_params
          )
          groups_request = urllib.request.Request(groups_url, headers=headers)
          with urllib.request.urlopen(groups_request, timeout=30) as response:
              groups_payload = json.load(response)
          group = next(
              (
                  candidate
                  for candidate in groups_payload.get("data", [])
                  if candidate.get("attributes", {}).get("name")
                  == internal_group_name
                  and candidate.get("attributes", {}).get("isInternalGroup")
                  is True
              ),
              None,
          )
          if group is None:
              raise SystemExit(
                  f"Internal beta group {internal_group_name!r} was not found "
                  f"for VoiceBrief app {app_id}."
              )

          group_id = group.get("id")
          if not group_id:
              raise SystemExit(
                  f"Internal beta group {internal_group_name!r} has no group ID."
              )
          relationship_url = (
              "https://api.appstoreconnect.apple.com/v1/betaGroups/"
              f"{urllib.parse.quote(group_id, safe='')}/relationships/builds"
          )

          def group_build_ids():
              relationship_request = urllib.request.Request(
                  relationship_url + "?limit=200",
                  headers=headers,
              )
              with urllib.request.urlopen(
                  relationship_request, timeout=30
              ) as response:
                  relationship_payload = json.load(response)
              return {
                  item.get("id")
                  for item in relationship_payload.get("data", [])
                  if item.get("type") == "builds" and item.get("id")
              }

          distribution_action = "alreadyPresent"
          if build_id not in group_build_ids():
              linkage = json.dumps(
                  {"data": [{"type": "builds", "id": build_id}]}
              ).encode("utf-8")
              attach_request = urllib.request.Request(
                  relationship_url,
                  data=linkage,
                  headers={
                      **headers,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(attach_request, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(
                          "Unexpected App Store Connect response while "
                          f"adding build to beta group: {response.status}."
                      )
              distribution_action = "added"

          if build_id not in group_build_ids():
              raise SystemExit(
                  f"VoiceBrief build {build_number} is not associated with "
                  f"{internal_group_name!r} after the distribution request."
              )

          prerelease_id = (
              build.get("relationships", {})
              .get("preReleaseVersion", {})
              .get("data", {})
              .get("id")
          )
          prerelease = next(
              (
                  item.get("attributes", {})
                  for item in payload.get("included", [])
                  if item.get("type") == "preReleaseVersions"
                  and item.get("id") == prerelease_id
              ),
              {},
          )
          beta_group_ids = {
              item.get("id")
              for item in (
                  build.get("relationships", {})
                  .get("betaGroups", {})
                  .get("data", [])
              )
          }
          beta_group_names = sorted(
              item.get("attributes", {}).get("name")
              for item in payload.get("included", [])
              if item.get("type") == "betaGroups"
              and item.get("id") in beta_group_ids
              and item.get("attributes", {}).get("name")
          )
          report = {
              "appId": app_id,
              "betaGroups": sorted(
                  set(beta_group_names + [internal_group_name])
              ),
              "buildId": build_id,
              "buildNumber": attributes.get("version"),
              "distributionAction": distribution_action,
              "appVersion": prerelease.get("version"),
              "platform": prerelease.get("platform"),
              "processingState": attributes.get("processingState"),
              "uploadedDate": attributes.get("uploadedDate"),
              "expirationDate": attributes.get("expirationDate"),
              "expired": attributes.get("expired"),
              "minOsVersion": attributes.get("minOsVersion"),
          }
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## VoiceBrief App Store Connect build status\n\n")
              summary.write(f"- App version: `{report['appVersion']}`\n")
              summary.write(f"- Build: `{report['buildNumber']}`\n")
              summary.write(f"- Processing state: `{report['processingState']}`\n")
              summary.write(
                  f"- Beta groups: `{', '.join(report['betaGroups']) or 'none'}`\n"
              )
              summary.write(
                  f"- Distribution action: `{report['distributionAction']}`\n"
              )
              summary.write(f"- Uploaded: `{report['uploadedDate']}`\n")
              summary.write(f"- Expires: `{report['expirationDate']}`\n")
              summary.write(f"- Minimum OS: `{report['minOsVersion']}`\n")

          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload the safe status report
        uses: actions/upload-artifact@v4
        with:
          name: voicebrief-appstore-build18-status
          path: ${{ runner.temp }}/voicebrief-appstore-build18.json
          if-no-files-found: error
          retention-days: 30
