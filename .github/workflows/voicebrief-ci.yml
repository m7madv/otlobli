name: VoiceBrief mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "voicebrief_flutter/**"
      - ".github/workflows/voicebrief-ci.yml"
  push:
    paths:
      - "voicebrief_flutter/**"
      - ".github/workflows/voicebrief-ci.yml"
      - "!voicebrief_flutter/**/*.md"

permissions:
  contents: read

jobs:
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions
        working-directory: voicebrief_flutter
      - run: deno lint supabase/functions
        working-directory: voicebrief_flutter
      - run: deno test --allow-env --config supabase/functions/process-audio/deno.json supabase/functions/process-audio/date_normalization_test.ts supabase/functions/process-audio/audio_metadata_test.ts
        working-directory: voicebrief_flutter
      - run: deno test supabase/functions/_shared/bounded_json_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --config supabase/functions/create-audio-upload/deno.json supabase/functions/create-audio-upload/core_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --config supabase/functions/legal/deno.json supabase/functions/legal/bounded_form_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --config supabase/functions/cleanup-expired-audio/deno.json supabase/functions/cleanup-expired-audio/core_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/core_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --config supabase/functions/revenuecat-webhook/deno.json supabase/functions/revenuecat-webhook/core_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --allow-read --config supabase/functions/revenuecat-webhook/deno.json supabase/functions/revenuecat-webhook/sql_contract_test.ts
        working-directory: voicebrief_flutter
      - run: deno test --config supabase/functions/sync-subscription/deno.json supabase/functions/sync-subscription/core_test.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/process-audio/deno.json supabase/functions/process-audio/index.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/create-audio-upload/deno.json supabase/functions/create-audio-upload/index.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/cleanup-expired-audio/deno.json supabase/functions/cleanup-expired-audio/index.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/legal/deno.json supabase/functions/legal/index.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/revenuecat-webhook/deno.json supabase/functions/revenuecat-webhook/index.ts
        working-directory: voicebrief_flutter
      - run: deno check --config supabase/functions/sync-subscription/deno.json supabase/functions/sync-subscription/index.ts
        working-directory: voicebrief_flutter
      - run: node --test scripts/google_play_subscriptions_test.mjs
        working-directory: voicebrief_flutter

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicebrief_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: voicebrief-debug-apk
          path: voicebrief_flutter/build/app/outputs/flutter-apk/app-debug.apk

  golden-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voicebrief_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/golden_screens_test.dart

  ios-no-codesign:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: voicebrief_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: pod install --project-directory=ios
      - name: Build the live iOS app without signing
        shell: bash
        env:
          VOICEBRIEF_SUPABASE_URL: ${{ secrets.VOICEBRIEF_SUPABASE_URL }}
          VOICEBRIEF_SUPABASE_ANON_KEY: ${{ secrets.VOICEBRIEF_SUPABASE_ANON_KEY }}
          VOICEBRIEF_REVENUECAT_IOS_PUBLIC_SDK_KEY: ${{ secrets.VOICEBRIEF_REVENUECAT_IOS_PUBLIC_SDK_KEY }}
          VOICEBRIEF_REVENUECAT_ANDROID_PUBLIC_SDK_KEY: ${{ secrets.VOICEBRIEF_REVENUECAT_ANDROID_PUBLIC_SDK_KEY }}
          VOICEBRIEF_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VOICEBRIEF_GOOGLE_IOS_CLIENT_ID }}
          VOICEBRIEF_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VOICEBRIEF_GOOGLE_WEB_CLIENT_ID }}
          VOICEBRIEF_APPLE_SERVICE_ID: ${{ secrets.VOICEBRIEF_APPLE_SERVICE_ID }}
          VOICEBRIEF_APPLE_REDIRECT_URI: ${{ secrets.VOICEBRIEF_APPLE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/voicebrief-dart-defines.json"
          trap 'rm -f "$config"' EXIT
          python3 - "$config" <<'PY'
          import json
          import os
          import pathlib
          import sys

          required = {
              "SUPABASE_URL": os.environ.get("VOICEBRIEF_SUPABASE_URL", ""),
              "SUPABASE_ANON_KEY": os.environ.get("VOICEBRIEF_SUPABASE_ANON_KEY", ""),
              "REVENUECAT_IOS_PUBLIC_SDK_KEY": os.environ.get("VOICEBRIEF_REVENUECAT_IOS_PUBLIC_SDK_KEY", ""),
              "GOOGLE_IOS_CLIENT_ID": os.environ.get("VOICEBRIEF_GOOGLE_IOS_CLIENT_ID", ""),
              "GOOGLE_WEB_CLIENT_ID": os.environ.get("VOICEBRIEF_GOOGLE_WEB_CLIENT_ID", ""),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing required VoiceBrief live configuration: " + ", ".join(missing))
          config = {
              "APP_ENV": "production",
              "USE_MOCK_SERVICES": False,
              **required,
              "REVENUECAT_ANDROID_PUBLIC_SDK_KEY": os.environ.get("VOICEBRIEF_REVENUECAT_ANDROID_PUBLIC_SDK_KEY", ""),
              "APPLE_SERVICE_ID": os.environ.get("VOICEBRIEF_APPLE_SERVICE_ID", ""),
              "APPLE_REDIRECT_URI": os.environ.get("VOICEBRIEF_APPLE_REDIRECT_URI", ""),
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(config), encoding="utf-8")
          PY
          flutter build ios --release --no-codesign --dart-define-from-file="$config"
      - name: Verify and package the unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'import UserNotifications' ios/ShareExtension/ShareViewController.swift
          grep -q 'voicebriefTarget.*sharedResult' ios/ShareExtension/ShareViewController.swift
          grep -q 'requestOpenProcessedResult' ios/Runner/AppDelegate.swift
          grep -q 'يمكنك إغلاق هذه النافذة' ios/ShareExtension/ShareViewController.swift
          grep -q 'voicebrief/reminders' ios/Runner/AppDelegate.swift
          ! grep -Eq 'UIApplication\.shared|nextResponder|performSelector|extensionContext.*\.open' ios/ShareExtension/ShareViewController.swift
          app="build/ios/iphoneos/Runner.app"
          extension="$app/PlugIns/VoiceBriefShare.appex"
          test -d "$app"
          test -d "$extension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' ios/Runner/Runner.entitlements)" = "Default"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/Runner/Runner.entitlements)" = "group.app.voicebrief.mobile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "app.voicebrief.mobile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")" = "app.voicebrief.mobile.share"
          app_short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          extension_short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$extension/Info.plist")"
          app_build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          extension_build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$extension/Info.plist")"
          test -n "$app_short_version"
          test -n "$app_build_version"
          test "$extension_short_version" = "$app_short_version"
          test "$extension_build_version" = "$app_build_version"
          test "$app_short_version" = "0.1.0"
          test "$app_build_version" = "19"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$app/Info.plist")" = "public.audio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:1' "$app/Info.plist")" = "public.mp3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:2' "$app/Info.plist")" = "public.mpeg-4-audio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:3' "$app/Info.plist")" = "com.microsoft.waveform-audio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$extension/Info.plist")" = "VoiceBrief"
          echo "Verified app and Share Extension version $app_short_version ($app_build_version)."
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R "$app" build/ios/unsigned-ipa/Payload/VoiceBrief.app
          (
            cd build/ios/unsigned-ipa
            zip -qry ../VoiceBrief-0.1.0-build19-live-unsigned.ipa Payload
          )
          shasum -a 256 build/ios/VoiceBrief-0.1.0-build19-live-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: voicebrief-ios-live-unsigned-${{ github.run_number }}
          path: voicebrief_flutter/build/ios/VoiceBrief-0.1.0-build19-live-unsigned.ipa
          if-no-files-found: error
