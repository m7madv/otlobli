name: Retired final release candidate workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Stop stale release path
        shell: bash
        run: |
          echo 'This workflow is retired because it used stale v86.208 artifacts and incomplete auth configuration.' >&2
          echo 'Use iOS Unsigned Build -> testflight for iOS, or Android Debug Build after its auth preflight passes.' >&2
          exit 1
