name: Final Release Candidate

on:
  workflow_dispatch:

jobs:
  ios-signed:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          OTLOBLI_RELAY_KEY: ${{ secrets.OTLOBLI_RELAY_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_AUTH_ENABLED: 'true'
          VITE_GOOGLE_WEB_CLIENT_ID: '677396296147-o5q0rt5qk2rq0rqh714kuki7gabkdmcu.apps.googleusercontent.com'
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_PUSH_ENABLED: 'true'
          VITE_WHATSAPP_API_URL: ${{ secrets.VITE_WHATSAPP_API_URL }}
          VITE_WHATSAPP_AUTH_MODE: ${{ secrets.VITE_WHATSAPP_AUTH_MODE }}
          VITE_SHEIN_WORKER_URL: ${{ secrets.VITE_SHEIN_WORKER_URL }}
          VITE_SHEIN_SCRAPER_URL: ${{ secrets.VITE_SHEIN_SCRAPER_URL }}
          VITE_USD_TO_SYP_RATE: ${{ secrets.VITE_USD_TO_SYP_RATE }}
      - run: npx cap sync ios
      - name: Configure Google callback
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_IOS_CLIENT_ID"
          prefix="${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          plist="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${GOOGLE_IOS_CLIENT_ID}" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string google" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string com.googleusercontent.apps.${prefix}" "$plist"
      - run: npm run verify:production-release -- --artifacts=ios
      - name: Import signing identity and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$APPLE_TEAM_ID"
          keychain="$RUNNER_TEMP/otlobli-signing.keychain-db"
          cert="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$cert" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p artifacts/final-enablement/ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/Otlobli.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>provisioningProfiles</key><dict><key>com.otlobli.app</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          app="$RUNNER_TEMP/Otlobli.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements :- "$app" > artifacts/final-enablement/ios/ARCHIVE_ENTITLEMENTS.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" > artifacts/final-enablement/ios/BUNDLE_ID.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist" > artifacts/final-enablement/ios/VERSION.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist" > artifacts/final-enablement/ios/BUILD.txt
          {
            /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier' "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist"
          } > artifacts/final-enablement/ios/PROVISIONING_PROFILE_REPORT.txt
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Otlobli.xcarchive" \
            -exportPath artifacts/final-enablement/ios -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee artifacts/final-enablement/ios/EXPORT_VALIDATION.log
          unzip -q artifacts/final-enablement/ios/*.ipa -d "$RUNNER_TEMP/otlobli-ipa-scan"
          node scripts/scan-release-artifacts.mjs "$RUNNER_TEMP/Otlobli.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/otlobli-ipa-scan"
          shasum -a 256 artifacts/final-enablement/ios/*.ipa > artifacts/final-enablement/ios/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: otlobli-v86.208-ios-signed
          path: artifacts/final-enablement/ios
          retention-days: 30

  android-signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          OTLOBLI_RELAY_KEY: ${{ secrets.OTLOBLI_RELAY_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_AUTH_ENABLED: 'true'
          VITE_GOOGLE_WEB_CLIENT_ID: '677396296147-o5q0rt5qk2rq0rqh714kuki7gabkdmcu.apps.googleusercontent.com'
          VITE_PUSH_ENABLED: 'true'
          VITE_WHATSAPP_API_URL: ${{ secrets.VITE_WHATSAPP_API_URL }}
          VITE_WHATSAPP_AUTH_MODE: ${{ secrets.VITE_WHATSAPP_AUTH_MODE }}
          VITE_SHEIN_WORKER_URL: ${{ secrets.VITE_SHEIN_WORKER_URL }}
          VITE_SHEIN_SCRAPER_URL: ${{ secrets.VITE_SHEIN_SCRAPER_URL }}
          VITE_USD_TO_SYP_RATE: ${{ secrets.VITE_USD_TO_SYP_RATE }}
      - run: npx cap sync android
      - run: npm run verify:production-release -- --artifacts=android
      - name: Configure Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/otlobli-upload.jks"
          echo "OTLOBLI_APP_STORE_FILE=$RUNNER_TEMP/otlobli-upload.jks" >> "$GITHUB_ENV"
          echo "OTLOBLI_APP_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OTLOBLI_APP_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OTLOBLI_APP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed AAB and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          mkdir -p ../artifacts/final-enablement/android
          cp app/build/outputs/bundle/release/app-release.aab ../artifacts/final-enablement/android/
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/final-enablement/android/
          apksigner verify --verbose --print-certs ../artifacts/final-enablement/android/app-release.apk > ../artifacts/final-enablement/android/APK_SIGNATURE_REPORT.txt
          jarsigner -verify -verbose -certs ../artifacts/final-enablement/android/app-release.aab > ../artifacts/final-enablement/android/AAB_SIGNATURE_REPORT.txt
          aapt dump badging ../artifacts/final-enablement/android/app-release.apk > ../artifacts/final-enablement/android/APK_PACKAGE_REPORT.txt
          mkdir -p "$RUNNER_TEMP/otlobli-apk-scan" "$RUNNER_TEMP/otlobli-aab-scan"
          unzip -q ../artifacts/final-enablement/android/app-release.apk -d "$RUNNER_TEMP/otlobli-apk-scan"
          unzip -q ../artifacts/final-enablement/android/app-release.aab -d "$RUNNER_TEMP/otlobli-aab-scan"
          node ../scripts/scan-release-artifacts.mjs "$RUNNER_TEMP/otlobli-apk-scan" "$RUNNER_TEMP/otlobli-aab-scan"
          sha256sum ../artifacts/final-enablement/android/app-release.aab ../artifacts/final-enablement/android/app-release.apk > ../artifacts/final-enablement/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: otlobli-v86.208-android-signed
          path: artifacts/final-enablement/android
          retention-days: 30
