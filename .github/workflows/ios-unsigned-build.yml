name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches: [main, codex/customer-wallet-group-orders]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Read the version from the project instead of hardcoding it: a stale
      # literal shipped IPAs named after a version they did not contain.
      - name: Resolve app version
        id: appver
        run: |
          version=$(grep -m1 'MARKETING_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//' | tr -d ' ')
          if [ -z "$version" ]; then echo "MARKETING_VERSION not found" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building iOS v$version"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        env:
          OTLOBLI_RELAY_KEY: ${{ secrets.OTLOBLI_RELAY_KEY }}

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_AUTH_ENABLED: 'true'
          VITE_GOOGLE_WEB_CLIENT_ID: '677396296147-o5q0rt5qk2rq0rqh714kuki7gabkdmcu.apps.googleusercontent.com'
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_PUSH_ENABLED: 'true'
          VITE_WHATSAPP_API_URL: ${{ secrets.VITE_WHATSAPP_API_URL }}
          VITE_WHATSAPP_AUTH_MODE: ${{ secrets.VITE_WHATSAPP_AUTH_MODE }}
          VITE_SHEIN_WORKER_URL: ${{ secrets.VITE_SHEIN_WORKER_URL }}
          VITE_SHEIN_SCRAPER_URL: ${{ secrets.VITE_SHEIN_SCRAPER_URL }}
          VITE_USD_TO_SYP_RATE: ${{ secrets.VITE_USD_TO_SYP_RATE }}

      - run: npx cap sync ios

      - name: Configure Google Sign-In callback
        env:
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "No iOS OAuth client configured; Google action remains hidden in this build."
            exit 0
          fi
          client_prefix="${VITE_GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          reversed_client_id="com.googleusercontent.apps.${client_prefix}"
          plist="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string google" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string ${reversed_client_id}" "$plist"

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | xcpretty || xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios/App
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r "otlobli-v${APP_VERSION}-iphone16-unsigned.ipa" Payload
          shasum -a 256 "otlobli-v${APP_VERSION}-iphone16-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: otlobli-ios-v${{ steps.appver.outputs.version }}-iphone16
          path: ios/App/otlobli-v${{ steps.appver.outputs.version }}-iphone16-unsigned.ipa
          retention-days: 30
