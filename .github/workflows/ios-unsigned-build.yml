name: iOS Unsigned Build

on:
  workflow_dispatch:
    inputs:
      store_diagnostics:
        description: 'Include the customer-visible store script isolation panel'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, codex/customer-wallet-group-orders]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Read the version from the project instead of hardcoding it: a stale
      # literal shipped IPAs named after a version they did not contain.
      - name: Resolve app version
        id: appver
        run: |
          version=$(grep -m1 'MARKETING_VERSION = ' ios/App/App.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//' | tr -d ' ')
          if [ -z "$version" ]; then echo "MARKETING_VERSION not found" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building iOS v$version"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile SHEIN raw prefetch rule with WebKit
        run: xcrun swift scripts/validate-shein-content-rule.swift

      - run: npm install
        env:
          OTLOBLI_RELAY_KEY: ${{ secrets.OTLOBLI_RELAY_KEY }}

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_AUTH_ENABLED: 'true'
          VITE_GOOGLE_WEB_CLIENT_ID: '677396296147-o5q0rt5qk2rq0rqh714kuki7gabkdmcu.apps.googleusercontent.com'
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_PUSH_ENABLED: 'true'
          VITE_WHATSAPP_API_URL: ${{ secrets.VITE_WHATSAPP_API_URL }}
          VITE_WHATSAPP_AUTH_MODE: ${{ secrets.VITE_WHATSAPP_AUTH_MODE }}
          VITE_SHEIN_WORKER_URL: ${{ secrets.VITE_SHEIN_WORKER_URL }}
          VITE_SHEIN_SCRAPER_URL: ${{ secrets.VITE_SHEIN_SCRAPER_URL }}
          VITE_USD_TO_SYP_RATE: ${{ secrets.VITE_USD_TO_SYP_RATE }}
          VITE_STORE_SCRIPT_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.store_diagnostics || false }}
          VITE_SHEIN_CLEAN_ROOM_DIAGNOSTICS: 'true'

      - run: npx cap sync ios

      - name: Configure Google Sign-In callback
        env:
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "No iOS OAuth client configured; Google action remains hidden in this build."
            exit 0
          fi
          client_prefix="${VITE_GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          reversed_client_id="com.googleusercontent.apps.${client_prefix}"
          plist="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string google" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string ${reversed_client_id}" "$plist"

      - name: Verify universal iPhone and iPad target
        run: |
          family_count=$(grep -c 'TARGETED_DEVICE_FAMILY = "1,2";' ios/App/App.xcodeproj/project.pbxproj)
          if [ "$family_count" -lt 2 ]; then
            echo "Debug and Release must both target iPhone and iPad." >&2
            exit 1
          fi
          grep -q '<key>UISupportedInterfaceOrientations~ipad</key>' ios/App/App/Info.plist

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | xcpretty || xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Inspect iPad support in built app
        working-directory: ios/App
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          plist_path = Path('build/Build/Products/Release-iphoneos/App.app/Info.plist')
          with plist_path.open('rb') as stream:
              info = plistlib.load(stream)
          families = set(info.get('UIDeviceFamily', []))
          if not {1, 2}.issubset(families):
              raise SystemExit(f'Expected UIDeviceFamily [1, 2], got {sorted(families)}')
          print(f"Universal device families: {sorted(families)}")
          print(f"Version/build: {info.get('CFBundleShortVersionString')}/{info.get('CFBundleVersion')}")
          PY

      - name: Verify clean-room diagnostic binary markers
        working-directory: ios/App
        run: |
          binary='build/Build/Products/Release-iphoneos/App.app/App'
          strings "$binary" > build/clean-room-binary-strings.txt
          for marker in \
            '[OTLOBLI_SHEIN_CLEAN]' \
            'RAW_WITH_CACHE_GUARD' \
            'CAPTURE_AND_BLOCKING' \
            'LEGACY_BROWSER_CONTROL' \
            'com.otlobli.shein.clean.raw-js-prefetch-block.v1'; do
            grep -Fq "$marker" build/clean-room-binary-strings.txt || {
              echo "Missing clean-room binary marker: $marker" >&2
              exit 1
            }
          done
          if find build/Build/Products/Release-iphoneos/App.app -name '*.map' -print -quit | grep -q .; then
            echo 'Source maps must not ship in the diagnostic IPA.' >&2
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: ios/App
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r "otlobli-v${APP_VERSION}-ipad-iphone-universal-unsigned.ipa" Payload
          shasum -a 256 "otlobli-v${APP_VERSION}-ipad-iphone-universal-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: otlobli-ios-v${{ steps.appver.outputs.version }}-ipad-iphone-universal
          path: ios/App/otlobli-v${{ steps.appver.outputs.version }}-ipad-iphone-universal-unsigned.ipa
          retention-days: 30
