name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install exact dependencies and native relay credentials
        run: npm ci
        env:
          OTLOBLI_RELAY_KEY: ${{ secrets.OTLOBLI_RELAY_KEY }}

      - name: Verify Android authentication configuration
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WHATSAPP_API_URL: ${{ secrets.VITE_WHATSAPP_API_URL }}
          WHATSAPP_AUTH_MODE: ${{ secrets.VITE_WHATSAPP_AUTH_MODE }}
          APPLE_ANDROID_CLIENT_ID: ${{ secrets.VITE_APPLE_ANDROID_CLIENT_ID }}
          APPLE_ANDROID_REDIRECT_URL: ${{ secrets.VITE_APPLE_ANDROID_REDIRECT_URL }}
          GOOGLE_WEB_CLIENT_ID: '677396296147-o5q0rt5qk2rq0rqh714kuki7gabkdmcu.apps.googleusercontent.com'
        run: |
          set -euo pipefail
          umask 077
          for variable in SUPABASE_URL SUPABASE_ANON_KEY WHATSAPP_API_URL WHATSAPP_AUTH_MODE APPLE_ANDROID_CLIENT_ID APPLE_ANDROID_REDIRECT_URL; do
            if [ -z "$(printenv "$variable" 2>/dev/null || true)" ]; then
              echo "Required Android authentication setting is missing: ${variable}" >&2
              exit 1
            fi
          done
          case "$WHATSAPP_AUTH_MODE" in
            real) ;;
            *) echo 'Android phone authentication must use the complete real OTP mode.' >&2; exit 1 ;;
          esac
          whatsapp_probe="$RUNNER_TEMP/whatsapp-health.json"
          apple_probe="$RUNNER_TEMP/apple-auth.json"
          google_probe="$RUNNER_TEMP/google-auth.json"
          apple_request="$RUNNER_TEMP/apple-auth-request.json"
          google_request="$RUNNER_TEMP/google-auth-request.json"
          trap 'rm -f "$whatsapp_probe" "$apple_probe" "$google_probe" "$apple_request" "$google_request"' EXIT

          python3 - \
            "$WHATSAPP_API_URL" \
            "$SUPABASE_URL" \
            "$APPLE_ANDROID_CLIENT_ID" \
            "$APPLE_ANDROID_REDIRECT_URL" \
            "$GOOGLE_WEB_CLIENT_ID" \
            "$apple_request" \
            "$google_request" <<'PY'
          import ipaddress
          import json
          import sys
          from urllib.parse import urlsplit

          (
              whatsapp_url,
              supabase_url,
              apple_client_id,
              apple_redirect_url,
              google_client_id,
              apple_request,
              google_request,
          ) = sys.argv[1:]

          def validate_https_base(label, value, expected_host=None):
              parsed = urlsplit(value)
              if parsed.scheme != "https" or not parsed.hostname:
                  raise SystemExit(f"{label} must be an HTTPS URL")
              if parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit(f"{label} contains unsupported URL components")
              if parsed.path not in ("", "/"):
                  raise SystemExit(f"{label} must not contain a path")
              hostname = parsed.hostname.lower()
              if expected_host and hostname != expected_host:
                  raise SystemExit(f"{label} points to an unexpected host")
              if hostname in {"localhost", "localhost.localdomain"} or hostname.endswith(".local"):
                  raise SystemExit(f"{label} must point to a production host")
              try:
                  address = ipaddress.ip_address(hostname)
              except ValueError:
                  address = None
              if address and not address.is_global:
                  raise SystemExit(f"{label} must not point to a private or local address")

          validate_https_base("WhatsApp API URL", whatsapp_url)
          validate_https_base(
              "Supabase URL",
              supabase_url,
              "dcicqdprtyhwmhegabay.supabase.co",
          )
          expected_client = "com.otlobli.app.signin"
          expected_redirect = (
              "https://dcicqdprtyhwmhegabay.supabase.co/"
              "functions/v1/apple-oauth-callback"
          )
          if apple_client_id != expected_client or apple_redirect_url != expected_redirect:
              raise SystemExit("Android Apple Services ID or callback does not match production")
          with open(apple_request, "w", encoding="utf-8") as stream:
              json.dump(
                  {
                      "action": "configuration-check",
                      "clientId": apple_client_id,
                      "redirectUrl": apple_redirect_url,
                  },
                  stream,
              )
          with open(google_request, "w", encoding="utf-8") as stream:
              json.dump({"action": "configuration-check", "clientId": google_client_id}, stream)
          PY

          supabase_base="${SUPABASE_URL%/}"
          whatsapp_status=$(curl --proto '=https' --connect-timeout 10 --max-time 20 --silent --show-error \
            --output "$whatsapp_probe" --write-out '%{http_code}' \
            "${WHATSAPP_API_URL%/}/health")
          apple_status=$(curl --proto '=https' --connect-timeout 10 --max-time 20 --silent --show-error \
            --output "$apple_probe" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --header "apikey: $SUPABASE_ANON_KEY" --header "authorization: Bearer $SUPABASE_ANON_KEY" \
            --data-binary "@$apple_request" \
            "$supabase_base/functions/v1/apple-auth")
          google_status=$(curl --proto '=https' --connect-timeout 10 --max-time 20 --silent --show-error \
            --output "$google_probe" --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --header "apikey: $SUPABASE_ANON_KEY" --header "authorization: Bearer $SUPABASE_ANON_KEY" \
            --data-binary "@$google_request" \
            "$supabase_base/functions/v1/google-auth")
          if [ "$whatsapp_status" != '200' ] || [ "$apple_status" != '200' ] || [ "$google_status" != '200' ]; then
            echo "Authentication preflight failed (phone HTTP ${whatsapp_status}, Apple HTTP ${apple_status}, Google HTTP ${google_status})." >&2
            exit 1
          fi
          python3 - "$whatsapp_probe" "$apple_probe" "$google_probe" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              phone = json.load(stream)
          if phone.get("status") != "ok":
              raise SystemExit("Phone authentication service is not healthy")
          if phone.get("sessionStoreReady") is not True or phone.get("authContract") != "customer-session-v1":
              raise SystemExit("Phone authentication service cannot issue persisted customer sessions")
          if phone.get("otpSecurityReady") is not True:
              raise SystemExit("Phone authentication service does not have hardened OTP storage")
          if phone.get("whatsappSenderReady") is not True or phone.get("whatsappConnected") is not True:
              raise SystemExit("Phone authentication WhatsApp sender is not currently connected")
          for provider, path in zip(("Apple Android", "Google Android"), sys.argv[2:]):
              with open(path, encoding="utf-8") as stream:
                  payload = json.load(stream)
              if payload != {"configured": True}:
                  raise SystemExit(f"{provider} is not allowlisted by the backend")
          print("Verified phone, Apple, and Google authentication for Android.")
          PY

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_API_URL: ${{ secrets.VITE_WHATSAPP_API_URL }}
          VITE_WHATSAPP_AUTH_MODE: ${{ secrets.VITE_WHATSAPP_AUTH_MODE }}
          VITE_SHEIN_WORKER_URL: ${{ secrets.VITE_SHEIN_WORKER_URL }}
          VITE_SHEIN_SCRAPER_URL: ${{ secrets.VITE_SHEIN_SCRAPER_URL }}
          VITE_USD_TO_SYP_RATE: ${{ secrets.VITE_USD_TO_SYP_RATE }}
          # ميزات v86 مفعّلة على الأندرويد (القيم أدناه عامة، غير سرّية):
          VITE_PUSH_ENABLED: 'true'
          VITE_GOOGLE_AUTH_ENABLED: 'true'
          VITE_GOOGLE_WEB_CLIENT_ID: '677396296147-o5q0rt5qk2rq0rqh714kuki7gabkdmcu.apps.googleusercontent.com'
          VITE_APPLE_ANDROID_CLIENT_ID: ${{ secrets.VITE_APPLE_ANDROID_CLIENT_ID }}
          VITE_APPLE_ANDROID_REDIRECT_URL: ${{ secrets.VITE_APPLE_ANDROID_REDIRECT_URL }}

      # استخدم مفتاح التطوير المُثبَّت (بصمته SHA-1 مسجّلة في Firebase) حتى يعمل
      # دخول جوجل على الـ APK. مفتاح debug غير سرّي (كلمة السر العامة "android").
      - name: Use registered debug keystore
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: otlobli-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Restore isolated production upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/otlobli-upload.jks"

      - name: Build signed, optimized release APK and App Bundle
        working-directory: android
        env:
          OTLOBLI_APP_STORE_FILE: ${{ runner.temp }}/otlobli-upload.jks
          OTLOBLI_APP_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          OTLOBLI_APP_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          OTLOBLI_APP_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease :app:bundleRelease

      - name: Verify release identity and hardening
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          build_tools_version=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          apksigner="$ANDROID_HOME/build-tools/$build_tools_version/apksigner"
          aapt="$ANDROID_HOME/build-tools/$build_tools_version/aapt"
          test -s "$apk"
          test -s "$aab"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -qi 'e0b0f44cc677888f9535c01c9125077e09b014bdb9096dc2813e3bd06f17f784' "$RUNNER_TEMP/apk-signature.txt"
          jarsigner -verify "$aab" 2>&1 | tee "$RUNNER_TEMP/aab-signature.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.otlobli.app' versionCode='1095' versionName='86.230'"
          if unzip -Z1 "$apk" | grep -q '\.map$'; then
            echo 'Source maps must not be shipped in the Android release.' >&2
            exit 1
          fi
          npm run verify:production-release -- --artifacts=android

      - uses: actions/upload-artifact@v4
        with:
          name: Otlobli-v86.230-Android-Production
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/otlobli-upload.jks"
