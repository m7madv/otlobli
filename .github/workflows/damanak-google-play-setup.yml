name: Damanak Google Play Setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect is read-only; apply creates priced drafts; activate publishes base plans
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - apply
          - activate
          - release

jobs:
  google-play:
    if: ${{ inputs.mode != 'release' }}
    name: ${{ inputs.mode }} Google Play subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: damanak_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect or create draft subscriptions
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          MODE_FLAG=""
          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            MODE_FLAG="--apply"
          elif [[ "${{ inputs.mode }}" == "activate" ]]; then
            MODE_FLAG="--activate"
          fi
          node scripts/google_play_setup.mjs \
            $MODE_FLAG \
            --output build/google-play-setup/report.json

      - name: Upload setup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damanak-google-play-setup-${{ inputs.mode }}-${{ github.run_number }}
          path: damanak_flutter/build/google-play-setup/report.json
          if-no-files-found: warn
          retention-days: 14

  android-release:
    if: ${{ inputs.mode == 'release' }}
    name: Build and publish Android internal release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: damanak_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Restore Damanak signing key
        env:
          DAMANAK_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DAMANAK_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$DAMANAK_ANDROID_UPLOAD_KEYSTORE_BASE64"
          echo "$DAMANAK_ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/damanak-upload.jks"
          chmod 600 "$RUNNER_TEMP/damanak-upload.jks"

      - name: Analyze, test, and build signed bundle
        env:
          DAMANAK_KEYSTORE_PATH: ${{ runner.temp }}/damanak-upload.jks
          DAMANAK_KEYSTORE_PASSWORD: ${{ secrets.DAMANAK_ANDROID_UPLOAD_KEY_PASSWORD }}
          DAMANAK_KEY_ALIAS: ${{ secrets.DAMANAK_ANDROID_UPLOAD_KEY_ALIAS }}
          DAMANAK_SUPABASE_URL: ${{ secrets.DAMANAK_SUPABASE_URL }}
          DAMANAK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAMANAK_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          test -n "$DAMANAK_KEYSTORE_PASSWORD"
          test -n "$DAMANAK_KEY_ALIAS"
          test -n "$DAMANAK_SUPABASE_URL"
          test -n "$DAMANAK_SUPABASE_PUBLISHABLE_KEY"
          flutter pub get
          flutter analyze
          flutter test
          flutter build appbundle \
            --release \
            --dart-define="DAMANAK_SUPABASE_URL=$DAMANAK_SUPABASE_URL" \
            --dart-define="DAMANAK_SUPABASE_PUBLISHABLE_KEY=$DAMANAK_SUPABASE_PUBLISHABLE_KEY"
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab

      - name: Publish completed internal release
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          node scripts/google_play_upload.mjs \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track internal \
            --status completed \
            --output build/google-play-upload/report.json

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damanak-android-internal-${{ github.run_number }}
          path: |
            damanak_flutter/build/app/outputs/bundle/release/app-release.aab
            damanak_flutter/build/google-play-upload/report.json
          if-no-files-found: warn
          retention-days: 30
