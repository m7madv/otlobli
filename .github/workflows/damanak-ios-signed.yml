name: Damanak iOS Signed Build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Validate and upload the signed IPA to App Store Connect
        required: true
        type: boolean
        default: false

jobs:
  build-ios-signed:
    name: Build signed App Store IPA
    runs-on: macos-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: damanak_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies and verify source
        env:
          DAMANAK_SUPABASE_URL: ${{ secrets.DAMANAK_SUPABASE_URL }}
          DAMANAK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAMANAK_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          grep -qx 'version: 4.5.1+30' pubspec.yaml
          test -n "$DAMANAK_SUPABASE_URL"
          test -n "$DAMANAK_SUPABASE_PUBLISHABLE_KEY"
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define="DAMANAK_SUPABASE_URL=$DAMANAK_SUPABASE_URL" \
            --dart-define="DAMANAK_SUPABASE_PUBLISHABLE_KEY=$DAMANAK_SUPABASE_PUBLISHABLE_KEY"

      - name: Install Damanak signing identity and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.DAMANAK_IOS_APP_STORE_PROFILE_BASE64 }}
        shell: bash
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/damanak-distribution.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/damanak.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/damanak.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/damanak.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/damanak.keychain-db"
          security import "$RUNNER_TEMP/damanak-distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/damanak.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/damanak.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/damanak.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/damanak.mobileprovision" > "$RUNNER_TEMP/damanak-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/damanak-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/damanak-profile.plist")
          cp "$RUNNER_TEMP/damanak.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "DAMANAK_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.damanak.damanak</key><string>$DAMANAK_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/signed \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify signed IPA and embedded profile
        shell: bash
        run: |
          IPA_PATH=$(find build/ios/signed -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/damanak-verify.XXXXXX")
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH="$VERIFY_DIR/Payload/Runner.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          security cms -D \
            -i "$APP_PATH/embedded.mobileprovision" \
            > "$RUNNER_TEMP/damanak-embedded-profile.plist"
          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/damanak-embedded-profile.plist")
          PROFILE_APPLE_SIGN_IN=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$RUNNER_TEMP/damanak-embedded-profile.plist")
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/damanak-app-entitlements.plist"
          APP_APPLE_SIGN_IN=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$RUNNER_TEMP/damanak-app-entitlements.plist")
          APP_DEEP_LINK_SCHEME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP_PATH/Info.plist")
          GOOGLE_CALLBACK_SCHEME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' "$APP_PATH/Info.plist")
          test "$APP_BUNDLE_ID" = "com.damanak.damanak"
          test "$APP_VERSION" = "4.5.1"
          test "$APP_BUILD" = "30"
          [[ "$PROFILE_APP_ID" == *".$APP_BUNDLE_ID" ]]
          test "$PROFILE_APPLE_SIGN_IN" = "Default"
          test "$APP_APPLE_SIGN_IN" = "Default"
          test "$APP_DEEP_LINK_SCHEME" = "com.damanak.damanak"
          test "$GOOGLE_CALLBACK_SCHEME" = "com.googleusercontent.apps.521030062021-lupo3mel3si0nmu9tijcblo13d4sqg4d"
          test -d "$APP_PATH/Frameworks/GoogleSignIn.framework"
          test -d "$APP_PATH/Frameworks/sign_in_with_apple.framework"
          echo "Verified signed bundle $APP_BUNDLE_ID, native Apple/Google sign-in, and its embedded App Store profile."

      - name: Validate and upload to App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          IPA_PATH=$(find build/ios/signed -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$KEY_DIRECTORY/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$KEY_DIRECTORY/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: damanak-ios-4.5.1-build-30-signed
          path: damanak_flutter/build/ios/signed/*.ipa
          if-no-files-found: error
          retention-days: 30
