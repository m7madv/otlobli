name: Damanak App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect is read-only; apply uploads the approved screenshots
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - apply
      version:
        description: Exact editable App Store version
        required: true
        type: string
        default: "4.6.0"
      locale:
        description: Exact localization to inspect or upload
        required: true
        type: choice
        default: en-US
        options:
          - ar-SA
          - en-US
          - es-ES
          - fr-FR
          - de-DE
          - pt-BR
          - zh-Hans
          - hi
          - ja
          - ru

jobs:
  app-store-screenshots:
    name: ${{ inputs.mode }} App Store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: damanak_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect or upload screenshots
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DAMANAK_STORE_VERSION: ${{ inputs.version }}
          DAMANAK_STORE_LOCALE: ${{ inputs.locale }}
        shell: bash
        run: |
          MODE_FLAG=""
          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            node scripts/verify_localizations.mjs
            node scripts/verify_store_localizations.mjs
            MODE_FLAG="--apply"
          fi
          node scripts/app_store_screenshots.mjs \
            $MODE_FLAG \
            --output build/app-store-assets/report.json

      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damanak-app-store-screenshots-${{ inputs.mode }}-${{ github.run_number }}
          path: damanak_flutter/build/app-store-assets/report.json
          if-no-files-found: warn
          retention-days: 14
